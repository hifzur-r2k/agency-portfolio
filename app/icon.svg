<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cinematic Dark Background with Rounded Corners -->
  <rect width="100" height="100" rx="22" fill="#050505"/>
  
  <!-- Outer Halo -->
  <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Inner Dashed Orbital -->
  <circle cx="50" cy="50" r="28" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="4 6"/>
  
  <!-- 3D Intersecting Rings (Thickened for tiny visibility) -->
  <ellipse cx="50" cy="50" rx="38" ry="12" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" transform="rotate(30 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="12" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" transform="rotate(90 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="12" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" transform="rotate(150 50 50)"/>
  
  <!-- Core Energy Dot -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
</svg>
